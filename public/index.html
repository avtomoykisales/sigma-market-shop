<script>
let state = {
  view: 'home',      // 'home' | 'catalog' | 'favorites'
  category: 'all',
  search: '',
  page: 1,
  limit: 12,
  total: 0,
  sort: 'default',
  cart: [],
  categories: [],
  settings: { blocks:{}, filters:{}, compare:true, favorites:true, quiz:{} },
  filters: {},          // {subcat:[], brand:[], subtype:[], priceMax, perfMin, perfMax}
  facets: null
};
const lsGet = (k, d) => { try { var v = JSON.parse(localStorage.getItem(k)); return (v === null || v === undefined) ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ===== URL / история =====
let _routing = false;   // true во время разбора URL (popstate/init) — тогда не трогаем историю
function setUrl(url) {
  if (_routing) return;
  const cur = location.pathname + location.search + location.hash;
  if (cur !== url) { try { history.pushState(null, '', url); } catch {} }
}
// Яндекс.Метрика: засчитать просмотр SPA-«страницы». Зовётся из setMeta (когда уже готов
// title) и из popstate. Первый вызов пропускаем — его считает сам счётчик в ym('init').
// Дедуп по URL, чтобы повторный setMeta для той же страницы не плодил просмотры.
let _ymLastHref = null;
function ymHit() {
  var href = location.href;
  if (href === _ymLastHref) return;
  if (_ymLastHref === null) { _ymLastHref = href; return; }   // первый — за счётчиком
  _ymLastHref = href;
  try { if (window.ym && window.YM_ID) ym(window.YM_ID, 'hit', href, { title: document.title }); } catch (e) {}
}
function replaceUrl(url) {
  const cur = location.pathname + location.search + location.hash;
  if (cur !== url) { try { history.replaceState(null, '', url); } catch {} }
}
// ---- ЧПУ ----
const _TRANSLIT = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya' };
function slugName(s) {
  return String(s || '').toLowerCase()
    .replace(/[а-яё]/g, c => (_TRANSLIT[c] != null ? _TRANSLIT[c] : c))
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70).replace(/-+$/, '');
}
function productUrl(p) { return '/product/' + p.id + (p && p.name ? '-' + slugName(p.name) : ''); }
function catalogUrl() {
  const sub = (state.filters.subcat || []);
  if (state.category === 'all' && !sub.length) return '/catalog';
  let u = '/catalog/' + state.category;
  if (sub.length === 1) u += '/' + sub[0];
  else if (sub.length > 1) u += '?subcategory=' + sub.join(',');
  return u;
}

// ===== SEO: обновление <title>/description/canonical на клиенте =====
const SEO_HOME_TITLE = 'SIGMA MARKET — профессиональное оборудование для автомоек, СТО и клининга';
const SEO_HOME_DESC = 'SIGMA MARKET — профессиональное оборудование для автомоек, СТО и автосервиса, клининга. Поставка, монтаж и сервис по всему Казахстану с 2012 года.';
function setMeta(title, desc, path, robots) {
  if (title) document.title = title;
  const d = document.getElementById('metaDescription');
  if (d && desc) d.setAttribute('content', desc);
  const attr = (sel, name, val) => {
    const el = document.querySelector(sel);
    if (el && val != null) el.setAttribute(name, val);
  };
  if (path) {
    const abs = location.origin + path;
    attr('#linkCanonical', 'href', abs);
    attr('meta[property="og:url"]', 'content', abs);
  }
  if (title) { attr('meta[property="og:title"]', 'content', title); attr('meta[name="twitter:title"]', 'content', title); }
  if (desc) { attr('meta[property="og:description"]', 'content', desc); attr('meta[name="twitter:description"]', 'content', desc); }
  const r = document.querySelector('meta[name="robots"]');
  if (r) r.setAttribute('content', window.SITE_NOINDEX ? 'noindex, nofollow'
    : (robots || (/favorites|Избранное/.test(title || '') ? 'noindex, follow' : 'index, follow')));
  ymHit();   // Метрика: title/URL уже финальные — засчитываем просмотр
}
function seoClip(s, n) {
  s = String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  return s.length <= n ? s : s.slice(0, n - 1).replace(/[\s.,;:–—-]+\S*$/, '') + '…';
}
// ручной SEO-текст из админки — без обрезки, только чистка тегов/пробелов
function seoRaw(s) {
  return String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

state.cart      = lsGet('cart', []);
let favIds      = lsGet('favorites', []);
let compareIds  = lsGet('compare', []);
let recentIds   = lsGet('recent', []);

// ===== INIT =====
async function init() {
  try { state.settings = { ...state.settings, ...(await getSettings()) }; } catch {}
  await loadCategories();
  renderCart();
  renderFavBadge();
  renderCompareBar();
  initQuizCta();
  handleRoute();   // showHome()/showCatalog()/showProduct()/showFavorites() уже сами вызывают renderRecent()
  window.addEventListener('hashchange', handleRoute);
  window.addEventListener('popstate', () => { handleRoute(); ymHit(); });
  document.querySelectorAll('[data-nav="home"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); closeDrawer(); showHome();
  }));
  document.querySelectorAll('[data-nav="catalog"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); closeDrawer(); showCatalog('all');
  }));
  document.querySelectorAll('[data-nav="favorites"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); closeDrawer(); showFavorites();
  }));
  initCatalogInfiniteScroll();
}

// Мобильная версия каталога: вместо кнопок страниц — подгрузка следующей страницы
// при подскроле к концу списка (кнопки скрыты в style.css для max-width:768px).
function initCatalogInfiniteScroll() {
  const sentinel = document.getElementById('catalogScrollSentinel');
  if (!sentinel || !('IntersectionObserver' in window)) return;
  const mq = window.matchMedia('(max-width: 768px)');
  let loading = false;
  new IntersectionObserver((entries) => {
    if (!entries[0].isIntersecting) return;
    if (!mq.matches) return;                              // только мобильная версия
    if (state.view !== 'catalog') return;                  // не в избранном и не на карточке товара
    if (!state.total) return;                               // первая страница ещё не загрузилась
    if (loading) return;
    if (state.page * state.limit >= state.total) return;   // дальше страниц нет
    loading = true;
    state.page += 1;
    loadProducts({ append: true }).catch(() => { state.page -= 1; }).finally(() => { loading = false; });
  }, { rootMargin: '200px 0px' }).observe(sentinel);
}

// Разбор URL: ?product= / ?q= / ?category= / #catalog / #favorites / #quiz / #consult / #cart / иначе — главная
function handleRoute() {
  _routing = true;
  try {
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    const cat = params.get('category');
    const prod = params.get('product');
    if (prod) { showProduct(+prod); return; }
    if (q) {
      const inp = document.getElementById('searchInput');
      if (inp) inp.value = q;
      state.search = q; state.page = 1;
      showCatalog('all');
      return;
    }
    if (cat) { showCatalog(cat, (params.get('subcategory') || '').split(',').filter(Boolean)); return; }
    // ЧПУ
    let mProd = location.pathname.match(/^\/product\/(\d+)/);
    if (mProd) { showProduct(+mProd[1]); return; }
    let mCat = location.pathname.match(/^\/catalog(?:\/([^/]+)(?:\/([^/]+))?)?\/?$/);
    if (mCat) {
      if (!mCat[1]) { showCatalog('all'); return; }
      const qsub = params.get('subcategory');
      const subs = mCat[2] ? [mCat[2]] : (qsub ? qsub.split(',').filter(Boolean) : []);
      showCatalog(mCat[1], subs);
      return;
    }
    if (location.hash === '#catalog') { showCatalog('all'); return; }
    if (location.hash === '#favorites') { showFavorites(); return; }
    if (location.hash === '#quiz') { openQuiz(); return; }
    if (location.hash === '#consult') { scrollToConsult(); return; }
    if (location.hash === '#cart') {
      if (!document.getElementById('cartPanel').classList.contains('open')) toggleCart();
      return;
    }
    if (location.pathname === '/') { showHome(); return; }   // чистый "/" → главная
    showNotFound();   // неизвестный адрес → 404
  } finally { _routing = false; }
}

// Подсветка активного пункта меню при SPA-переключении
function setActiveNav(name) {
  document.querySelectorAll('.main-nav [data-nav], .drawer-nav [data-nav]').forEach(a => {
    a.classList.toggle('active', a.dataset.nav === name);
  });
}

async function loadCategories() {
  let cats;
  if (window.__HYDRATE__ && window.__HYDRATE__.categories) {
    cats = window.__HYDRATE__.categories;
    window.__HYDRATE__.categories = null;   
  } else {
    cats = await apiFetch('/api/categories');
  }
  state.categories = cats;
  renderCatTabs();   
  loadHomeSubcats();
}

// Заполняет вкладки категорий в каталоге (у категорий — короткая подпись). Вызывается
// и здесь (на случай если catalogView уже был на странице), и из showCatalog() —
// чтобы вкладки точно появились, даже если каталог подгрузился позже первого захода.
const CAT_SHORT = { avtomojka: 'Автомойка', sto: 'СТО и автосервис', klining: 'Клининг' };
function renderCatTabs() {
  const tabs = document.getElementById('catTabs');
  if (!tabs || tabs.dataset.filled) return;
  const cats = state.categories || [];
  const shortCat = c => CAT_SHORT[c.slug] || String(c.name).replace(/^Оборудование для\s+/i, '').trim() || c.name;
  tabs.innerHTML = `<button class="cat-tab cat-tab--all active" data-slug="all" onclick="selectCategory('all',this)">Все</button>` +
    cats.map(c => `<button class="cat-tab cat-tab--cat" data-slug="${c.slug}" onclick="selectCategory('${c.slug}',this)">${shortCat(c)}</button>`).join('');
  tabs.dataset.filled = '1';
}

const esc = s => String(s || '').replace(/'/g, "\\'");

// ===== Слайдер направлений (только категории) =====
async function loadHomeSubcats() {
  const wrap = document.getElementById('homeSubcatSlider');
  const track = document.getElementById('homeSubcatTrack');
  if (!wrap || !track) return;
  const cats = state.categories || [];
  if (!cats.length) { wrap.style.display = 'none'; return; }

  const iconImg = (icon, alt) => `<div class="subcat-slide-icon"><img src="${catIconUrl(icon)}" alt="${esc(alt || '')}" loading="lazy"
    onerror="this.onerror=null;this.src='/assets/icons/cat-wash.png';this.onerror=function(){this.closest('.subcat-slide-icon').style.display='none'}"></div>`;

  wrap.style.display = '';
  track.innerHTML = cats.map(c => `
    <a class="subcat-slide subcat-slide--cat" href="/catalog/${esc(c.slug)}" onclick="showCatalog('${esc(c.slug)}');return false;">
      ${iconImg(c.icon, c.name)}
      <div class="subcat-slide-name">${c.name}</div>
    </a>`).join('');
  track.onscroll = updateHomeSubcatBtns;
  requestAnimationFrame(updateHomeSubcatBtns);
}

function updateHomeSubcatBtns() {
  const track = document.getElementById('homeSubcatTrack');
  const wrap = document.getElementById('homeSubcatSlider');
  if (!track || !wrap) return;
  const prev = wrap.querySelector('.subcat-slider-btn.prev');
  const next = wrap.querySelector('.subcat-slider-btn.next');
  const max = track.scrollWidth - track.clientWidth - 2;
  if (prev) prev.disabled = track.scrollLeft <= 2;
  if (next) next.disabled = track.scrollLeft >= max;
}

function slideHomeSubcats(dir) {
  const track = document.getElementById('homeSubcatTrack');
  if (!track) return;
  const step = Math.max(track.clientWidth * 0.8, 240);
  track.scrollBy({ left: dir * step, behavior: 'smooth' });
}

// ===== VIEW SWITCHING =====
function scrollToView(id) {
  const el = document.getElementById(id);
  if (!el) return;
  // чтение getBoundingClientRect форсирует пересчёт лейаута после смены display
  const y = Math.max(0, el.getBoundingClientRect().top + window.scrollY - 72);
  window.scrollTo(0, y); // плавность добавляет CSS html{scroll-behavior:smooth}
}

// Разметка каждого экрана (home/catalog/product/notFound) сервер шлёт только для
// того, что реально нужно на этот адрес — остальные подгружаем сюда же по требованию,
// один раз, при первом переходе (дальше уже просто show/hide, как раньше).
const _viewPartial = { home: 'home', catalog: 'catalog', product: 'product', notFound: 'notfound' };
const _viewLoading = {};
async function ensureView(name) {
  if (document.getElementById(name + 'View')) return;
  if (!_viewLoading[name]) {
    _viewLoading[name] = fetch('/partials/' + _viewPartial[name] + '.html')
      .then(r => r.text())
      .then(html => {
        if (document.getElementById(name + 'View')) return; // подгрузили, пока ждали (двойной клик и т.п.)
        const tmp = document.createElement('div');
        tmp.innerHTML = html.trim();
        document.getElementById('main').insertBefore(tmp.firstElementChild, document.getElementById('recentSection'));
      });
  }
  return _viewLoading[name];
}

async function setView(name) {
  await ensureView(name);
  // Остальные три экрана могут быть ещё не подгружены вообще (не просто скрыты) —
  // прятать нечего, пропускаем несуществующие.
  ['homeView', 'catalogView', 'productView', 'notFoundView'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = (id === name + 'View') ? '' : 'none';
  });
  syncViewHeadings(name);
  renderSubcatBar();
  renderCatalogAbout();
}

// На странице должен быть ровно один <h1> — заголовок активного вида.
// Заголовки скрытых видов понижаем до <h2>, чтобы не плодить дубли для SEO.
function retagHeading(el, tag) {
  if (!el || el.tagName === tag) return;
  const n = document.createElement(tag);
  for (const a of el.attributes) n.setAttribute(a.name, a.value);
  n.innerHTML = el.innerHTML;
  el.replaceWith(n);
}
function syncViewHeadings(name) {
  const map = {
    home: document.getElementById('homeH1'),
    catalog: document.getElementById('catalogTitle'),
    product: document.querySelector('#productView .pv-name'),
    notFound: document.getElementById('nfTitle'),
  };
  for (const [view, el] of Object.entries(map)) retagHeading(el, view === name ? 'H1' : 'H2');
}

async function showHome() {
  state.view = 'home';
  state.search = '';
  await setView('home');
  initQuizCta();   // если homeView подгрузился только сейчас — баннер квиза ещё не инициализирован
  loadHomeSubcats();   // то же самое для направлений на главной
  setActiveNav('home');
  renderRecent();
  setUrl('/');
  setMeta(SEO_HOME_TITLE, SEO_HOME_DESC, '/');
  window.scrollTo(0, 0);
}

const SEO_CAT_TITLE = {
  avtomojka: 'Оборудование для автомойки — купить в Казахстане | SIGMA MARKET',
  sto: 'Оборудование для СТО и автосервиса — купить в Казахстане | SIGMA MARKET',
  klining: 'Оборудование для клининга — купить в Казахстане | SIGMA MARKET',
};
const SEO_CAT_DESC = {
  avtomojka: 'Оборудование для автомоек: аппараты высокого давления, пеногенераторы, системы очистки и оборотного водоснабжения, пылесосы, сушка. Поставка и монтаж по Казахстану.',
  sto: 'Оборудование для СТО и автосервиса: подъёмники, шиномонтаж, компрессоры, пневмоинструмент, оборудование для смазки и замены жидкостей. Поставка и сервис по Казахстану.',
  klining: 'Профессиональное клининговое оборудование: поломоечные и подметальные машины, профессиональные пылесосы, аппараты высокого давления. Поставка и обслуживание по Казахстану.',
};
function applyCatalogMeta() {
  const sub = state.filters.subcat || [];
  const cat = (state.categories || []).find(c => c.slug === state.category);
  if (!cat) {
    if (state.search) {
      setMeta('Поиск: ' + state.search + ' — SIGMA MARKET',
        'Результаты поиска по каталогу SIGMA MARKET.', '/catalog', 'noindex, follow');
    } else {
      setMeta('Каталог оборудования — SIGMA MARKET',
        'Каталог профессионального оборудования SIGMA MARKET: для автомоек, СТО и клининга. Поставка и монтаж по Казахстану.',
        '/catalog');
    }
    return;
  }
  let subRow = null;
  if (sub.length === 1) {
    subRow = (state.facets && state.facets.subcategories || []).find(s => s.slug === sub[0]) || null;
  }
  const subName = subRow ? subRow.name : '';
  // Title не обрезаем ни ручной, ни авто (Евгений просил)
  const title = subName
    ? (subRow.seo_title ? seoRaw(subRow.seo_title)
        : seoRaw(subName + ' — ' + cat.name + ' | SIGMA MARKET'))
    : (cat.seo_title ? seoRaw(cat.seo_title)
        : (SEO_CAT_TITLE[cat.slug] || (cat.name + ' — SIGMA MARKET')));
  const desc = subName
    ? (subRow.seo_description ? seoRaw(subRow.seo_description)
        : seoClip(subName + ' — ' + cat.name + '. Поставка, монтаж и сервис по Казахстану от SIGMA MARKET.', 175))
    : (cat.seo_description ? seoRaw(cat.seo_description)
        : (SEO_CAT_DESC[cat.slug]
        || seoClip(cat.name + '. Профессиональное оборудование от SIGMA MARKET. Поставка по Казахстану.', 175)));
  // Несколько подкатегорий сразу — комбинация фильтров: не индексируем, canonical на категорию
  const multiSub = sub.length > 1;
  setMeta(title, desc, multiSub ? '/catalog/' + cat.slug : catalogUrl(), multiSub ? 'noindex, follow' : undefined);
}

// 404: адрес не распознан ЛИБО категория/товар с таким slug/id не существует
async function showNotFound() {
  state.view = 'notfound';
  await setView('notFound');
  setActiveNav('');
  setMeta('Страница не найдена — 404 | SIGMA MARKET',
    'Запрошенная страница не существует или была перемещена. Посмотрите каталог оборудования SIGMA MARKET.',
    location.pathname, 'noindex, follow');
  scrollToView('notFoundView');
}

async function showCatalog(slug, subcat) {
  // категория с таким slug не существует (и это не служебное "все") → 404
  if (slug && slug !== 'all' && state.categories && state.categories.length &&
      !state.categories.some(c => c.slug === slug)) {
    showNotFound();
    return;
  }
  state.view = 'catalog';
  state.category = slug || 'all';
  state.page = 1;
  state.filters = { subcat: Array.isArray(subcat) ? subcat : (subcat ? [subcat] : []) };
  state._builtFor = null;   // заставить перестроить панель фильтров
  setUrl(catalogUrl());
  await setView('catalog');
  renderCatTabs();   // на случай если catalogView подгрузился только сейчас
  document.getElementById('catTabs').style.display = '';
  document.getElementById('catalogFilters').style.display = '';
  document.getElementById('catalogLabel').textContent = 'каталог оборудования';
  setActiveNav('catalog');
  updateBreadcrumb();
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.slug === state.category));
  loadProducts();
  renderRecent();
  scrollToView('catalogView');
}

async function showFavorites() {
  state.view = 'favorites';
  state.page = 1;
  setUrl('/#favorites');
  await setView('catalog');
  document.getElementById('catTabs').style.display = 'none';
  document.getElementById('catalogFilters').style.display = 'none';
  document.getElementById('catalogLabel').textContent = 'сохранённое';
  document.getElementById('catalogTitle').textContent = `Избранное (${favIds.length})`;
  document.getElementById('crumbTrail').innerHTML = '';
  setActiveNav('favorites');
  setMeta('Избранное — SIGMA MARKET', 'Сохранённые товары в SIGMA MARKET.', '/#favorites');
  loadFavorites();
  renderRecent();
  scrollToView('catalogView');
}

function selectCategory(slug, btn) {
  state.category = slug;
  state.page = 1;
  state.filters = {};
  state._builtFor = null;
  setUrl(catalogUrl());
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  updateBreadcrumb();
  loadProducts();
  scrollToView('catalogView');
}

function updateBreadcrumb() {
  document.getElementById('catalogFilters').style.display = state.settings.filters.enabled === false ? 'none' : '';
  const cat = state.categories.find(c => c.slug === state.category);
  const sub = state.filters.subcat || [];
  const allSubs = (state.facets && state.facets.subcategories) || [];
  const bySlug = allSubs.reduce((o, s) => { o[s.slug] = s; return o; }, {});
  let subName = '', subChain = [];   // subChain = [[name, slug]...] родители сверху вниз
  if (sub.length === 1) {
    let curS = bySlug[sub[0]];
    subName = curS ? curS.name : sub[0];
    const seen = new Set();
    while (curS && curS.parent_slug && !seen.has(curS.parent_slug)) {
      seen.add(curS.parent_slug);
      const par = bySlug[curS.parent_slug];
      if (!par) break;
      subChain.unshift([par.name, par.slug]);
      curS = par;
    }
  }
  // H1 = самое конкретное название раздела
  let h1 = 'Товары и услуги';
  if (subName) h1 = subName;
  else if (state.category !== 'all') h1 = cat ? cat.name : state.category;
  document.getElementById('catalogTitle').textContent = h1;
  // Хлебные крошки — отдельной строкой
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sep = ' <span style="color:#9aa39a">›</span> ';
  const parts = [
    '<a href="/" onclick="showHome();return false">Главная</a>',
    '<a href="/catalog" onclick="showCatalog(\'all\');return false">Товары и услуги</a>',
  ];
  if (state.category !== 'all') {
    const cs = state.category;
    if (subName || sub.length > 1) {
      parts.push(`<a href="/catalog/${esc(cs)}" onclick="showCatalog('${esc(cs)}');return false">${esc(cat ? cat.name : cs)}</a>`);
    } else {
      parts.push(esc(cat ? cat.name : cs));
    }
    for (const [pName, pSlug] of subChain) {
      parts.push(`<a href="/catalog/${esc(cs)}/${esc(pSlug)}" onclick="pickSubcat('${esc(pSlug)}');return false">${esc(pName)}</a>`);
    }
  }
  if (subName) parts.push(esc(subName));
  else if (sub.length > 1) parts.push('подкатегорий: ' + sub.length);
  document.getElementById('crumbTrail').innerHTML = parts.join(sep);
}

// ===== PRODUCTS =====
// Если открыт прямой адрес каталога (/catalog/...) и это самый первый вызов без
// фильтров/поиска/страниц — сервер уже прислал ровно эти же товары в window.__HYDRATE__
// (см. seo.js/buildHydrate в server.js). Берём их вместо повторного похода на /api/products;
// любое изменение фильтров/страницы дальше всё равно идёт обычным fetch-ом.
function hydratedProducts() {
  const hy = window.__HYDRATE__;
  const hyFilter = hy && hy.productsFilter;
  const f = state.filters;
  if (!hy || !hy.products || !hyFilter) return null;
  if (state.page !== 1 || state.sort !== 'default' || state.search) return null;
  if ((f.brand && f.brand.length) || (f.subtype && f.subtype.length)) return null;
  if (f.priceMin || f.priceMax || f.perfMin || f.perfMax) return null;
  if (state.category !== hyFilter.category) return null;
  if (((f.subcat && f.subcat[0]) || '') !== hyFilter.subcat) return null;
  const data = hy.products;
  hy.products = null;   // одноразовое использование
  return data;
}

async function loadProducts(opts) {
  const append = !!(opts && opts.append);
  const grid = document.getElementById('productGrid');

  const f = state.filters;
  const hydrated = !append && hydratedProducts();
  let data;
  if (hydrated) {
    data = hydrated;
  } else {
    if (!append) grid.innerHTML = '<div class="spinner"><div class="spin"></div>&nbsp; Загрузка…</div>';
    const qs = new URLSearchParams({ page: state.page, limit: state.limit, sort: state.sort, facets: '1' });
    if (state.category !== 'all') qs.set('category', state.category);
    if (f.subcat && f.subcat.length) qs.set('subcategory', f.subcat.join(','));
    if (state.search) qs.set('search', state.search);
    if (f.brand && f.brand.length) qs.set('brand', f.brand.join(','));
    if (f.subtype && f.subtype.length) qs.set('subtype', f.subtype.join(','));
    if (f.priceMin) qs.set('priceMin', f.priceMin);
    if (f.priceMax) qs.set('priceMax', f.priceMax);
    if (f.perfMin) qs.set('perfMin', f.perfMin);
    if (f.perfMax) qs.set('perfMax', f.perfMax);
    data = await apiFetch('/api/products?' + qs.toString());
  }
  // Сервер отличает «подкатегории вообще нет» от «есть, но пока пусто» — в первом
  // случае это настоящий 404, а не «Ничего не найдено» с пустым каталогом.
  if (data.subcategoryNotFound) { showNotFound(); return; }
  state.total = data.total || 0;

  if (append) {
    // Подгрузка при скролле (мобильная версия) — только дописываем карточки,
    // не трогаем фильтры/хлебные крошки/шапку каталога, чтобы не дёргать страницу.
    grid.insertAdjacentHTML('beforeend', data.products.map(p => cardHtml(p)).join(''));
    renderPagination(data.total);
    return;
  }

  if (data.facets) {
    state.facets = data.facets;
    // перестраиваем панель фильтров только при смене категории — иначе не теряем клики/фокус
    if (state._builtFor !== state.category) { buildFilters(); state._builtFor = state.category; }
    else syncFilterChecks();
  } else {
    document.getElementById('catalogFilters').style.display = 'none';
    document.querySelector('.btn-filters-mobile').style.display = 'none';
  }
  if (state.view === 'catalog') { updateBreadcrumb(); applyCatalogMeta(); }
  renderCatalogAbout();
  renderActiveFilters();
  document.getElementById('resultsCount').textContent = `Найдено: ${data.total} товаров`;

  if (!data.products.length) {
    grid.innerHTML = '<div class="spinner">Ничего не найдено. Попробуйте изменить фильтры.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  grid.innerHTML = data.products.map(p => cardHtml(p)).join('');
  renderPagination(data.total);
}

async function loadFavorites() {
  const grid = document.getElementById('productGrid');
  document.getElementById('activeFilters').innerHTML = '';
  if (!favIds.length) {
    grid.innerHTML = '<div class="spinner">В избранном пока пусто. Нажмите ♡ на карточке товара.</div>';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('resultsCount').textContent = '';
    return;
  }
  grid.innerHTML = '<div class="spinner"><div class="spin"></div></div>';
  const items = await Promise.all(favIds.map(id => apiFetch('/api/products/' + id).catch(() => null)));
  const products = items.filter(Boolean);
  document.getElementById('resultsCount').textContent = `В избранном: ${products.length}`;
  grid.innerHTML = products.map(p => cardHtml(p)).join('');
  document.getElementById('pagination').innerHTML = '';
}

// ===== ФИЛЬТРЫ =====
function buildFilters() {
  const s = state.settings.filters || {};
  if (s.enabled === false) { document.getElementById('catalogFilters').style.display = 'none'; return; }
  const fc = state.facets; if (!fc) return;
  const f = state.filters;
  let html = '';

  const subs = fc.subcategories || [];
  if (state.category !== 'all' && subs.length) {
    const cur = (f.subcat || [])[0] || null;
    const row = (sc, depth) => `<label class="filter-check${depth ? ' filter-check-child' : ''}"${depth ? ` style="padding-left:${6 + depth * 16}px"` : ''}>
        <input type="radio" name="fltSubcat" value="${sc.slug}" ${cur === sc.slug ? 'checked' : ''}
          onchange="pickSubcat(this.value)">
        <span class="fc-name">${sc.name}</span> <span class="fc-cnt">${sc.cnt}</span></label>`;
    const kidsOf = ps => subs.filter(sc => sc.parent_slug === ps);
    const branch = (sc, depth) => row(sc, depth) + kidsOf(sc.slug).map(k => branch(k, depth + 1)).join('');
    html += `<div class="filter-group filter-subcat"><h4>Подкатегория</h4>` +
      `<label class="filter-check"><input type="radio" name="fltSubcat" value="" ${cur ? '' : 'checked'} onchange="clearSubcatFilter()"><span class="fc-name">Все</span></label>` +
      subs.filter(sc => !sc.parent_slug).map(sc => branch(sc, 0)).join('') +
      `</div>`;
  }

  if (s.brand !== false && fc.brands.length) {
    html += `<div class="filter-group"><h4>Бренд</h4>` +
      fc.brands.map(b => `<label class="filter-check"><input type="checkbox" value="${b}"
        ${(f.brand||[]).includes(b)?'checked':''} onchange="toggleArrFilter('brand',this.value)"> ${b === '__none__' ? 'Другой' : b}</label>`).join('') +
      `</div>`;
  }
  if (s.subtype !== false && fc.subtypes.length) {
    html += `<div class="filter-group"><h4>Тип</h4>` +
      fc.subtypes.map(b => `<label class="filter-check"><input type="checkbox" value="${b}"
        ${(f.subtype||[]).includes(b)?'checked':''} onchange="toggleArrFilter('subtype',this.value)"> ${b}</label>`).join('') +
      `</div>`;
  }
  if (s.price !== false && fc.priceMax > fc.priceMin) {
    html += `<div class="filter-group"><h4>Цена, ₸</h4>
      <div class="filter-range">
        <input type="number" placeholder="от" value="${f.priceMin||''}" oninput="state.filters.priceMin=this.value" onchange="reloadFiltered()">
        <input type="number" placeholder="до ${formatPrice(fc.priceMax)}" value="${f.priceMax||''}" oninput="state.filters.priceMax=this.value" onchange="reloadFiltered()">
      </div></div>`;
  }
  if (s.perf !== false && fc.perfMax > fc.perfMin) {
    html += `<div class="filter-group"><h4>Производительность</h4>
      <div class="filter-range">
        <input type="number" placeholder="от ${fc.perfMin}" value="${f.perfMin||''}" oninput="state.filters.perfMin=this.value" onchange="reloadFiltered()">
        <input type="number" placeholder="до ${fc.perfMax}" value="${f.perfMax||''}" oninput="state.filters.perfMax=this.value" onchange="reloadFiltered()">
      </div></div>`;
  }
  const panel = document.getElementById('catalogFilters');
  const mBtn = document.querySelector('.btn-filters-mobile');
  if (!html) {
    panel.style.display = 'none';
    if (mBtn) mBtn.style.display = 'none';
    return;
  }
  panel.style.display = '';
  if (mBtn) mBtn.style.display = '';
  document.getElementById('filtersBody').innerHTML = html;
  renderSubcatBar();
}

function toggleArrFilter(key, val) {
  const arr = state.filters[key] || (state.filters[key] = []);
  const i = arr.indexOf(val);
  i === -1 ? arr.push(val) : arr.splice(i, 1);
  if (key === 'subcat') setUrl(catalogUrl());
  reloadFiltered();
}
// синхронизирует чекбоксы/поля панели с state.filters (без перестроения DOM)
function syncFilterChecks() {
  const f = state.filters;
  document.querySelectorAll('#filtersBody input[type="checkbox"]').forEach(cb => {
    const m = (cb.getAttribute('onchange') || '').match(/toggleArrFilter\('(\w+)'/);
    if (m) cb.checked = (f[m[1]] || []).includes(cb.value);
  });
  const curSub = (f.subcat || [])[0] || '';
  document.querySelectorAll('#filtersBody input[name="fltSubcat"]').forEach(r => { r.checked = (r.value === curSub); });
  renderSubcatBar();
}

// Лента подкатегорий над каталогом — «проваливание»: один ряд текущего уровня
function renderSubcatBar() {
  const bar = document.getElementById('subcatBar');
  if (!bar) return;   // catalogView ещё не подгружен (мы на другом экране) — рендерить нечего
  const all = (state.facets && state.facets.subcategories) || [];
  if (state.view !== 'catalog' || state.category === 'all' || all.length < 2) { bar.style.display = 'none'; return; }
  const sel = (state.filters.subcat || [])[0] || null;
  const bySlug = all.reduce((o, s) => { o[s.slug] = s; return o; }, {});
  const kidsOf = ps => all.filter(s => s.parent_slug === ps);

  // раскрытый уровень: выбрана группа с детьми → она сама; выбран лист → его родитель; иначе — верх
  let level = null;
  if (sel && bySlug[sel]) {
    const s = bySlug[sel];
    level = kidsOf(sel).length ? sel : (s.parent_slug || null);
  }
  const rowItems = level ? kidsOf(level) : all.filter(s => !s.parent_slug);
  const par = level ? bySlug[level] : null;
  // внутри группы убираем из названий подгрупп повторяющийся префикс родителя
  const label = s => {
    if (par) {
      const pn = par.name.replace(/\s*\([^)]*\)\s*$/, '').trim();
      const re = new RegExp('^' + pn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*', 'i');
      const cut = s.name.replace(re, '').trim();
      if (cut && cut.length < s.name.length) return cut.charAt(0).toUpperCase() + cut.slice(1);
    }
    return s.name;
  };
  const chip = s => `<button class="subcat-chip${sel === s.slug ? ' active' : ''}" onclick="pickSubcat('${esc(s.slug)}')">${label(s)} <span>${s.cnt}</span></button>`;

  let html = '';
  if (level) {
    const upSlug = par.parent_slug || '';
    const upLabel = upSlug ? bySlug[upSlug].name : 'Все разделы';
    html += `<button class="subcat-chip subcat-chip-up" onclick="pickSubcat('${esc(upSlug)}')">‹ ${upLabel}</button>`;
    html += `<button class="subcat-chip subcat-chip-group${sel === level ? ' active' : ''}" onclick="pickSubcat('${esc(level)}')">Все «${par.name}» <span>${par.cnt}</span></button>`;
  } else {
    html += `<button class="subcat-chip${sel ? '' : ' active'}" onclick="clearSubcatFilter()">Все</button>`;
  }
  html += rowItems.map(chip).join('');
  bar.style.display = 'block';
  bar.innerHTML = `<div class="subcat-row">${html}</div>`;
}
function pickSubcat(slug) {
  state.filters.subcat = slug ? [slug] : [];
  setUrl(catalogUrl());
  reloadFiltered();
}
function clearSubcatFilter() {
  state.filters.subcat = [];
  setUrl(catalogUrl());
  reloadFiltered();
}
function reloadFiltered() { state.page = 1; loadProducts(); }
function openFilters() {
  document.getElementById('catalogFilters').classList.add('open');
  document.getElementById('filtersOverlay').classList.add('open');
}
function closeFilters() {
  document.getElementById('catalogFilters').classList.remove('open');
  document.getElementById('filtersOverlay').classList.remove('open');
}
function resetFilters() {
  state.filters = {};
  state.search = '';
  const inp = document.getElementById('searchInput');
  if (inp) inp.value = '';
  document.querySelectorAll('#filtersBody input').forEach(i => { if (i.type === 'checkbox') i.checked = false; else i.value = ''; });
  setUrl(catalogUrl());
  reloadFiltered();
}
function clearSearch() {
  state.search = '';
  const inp = document.getElementById('searchInput');
  if (inp) inp.value = '';
  reloadFiltered();
}
function renderActiveFilters() {
  const f = state.filters, chips = [];
  // Поиск — отдельная плашка: он не сбрасывается при переключении категорий/подкатегорий
  // и молча продолжает применяться вместе с ними (можно случайно получить «Найдено: 0»
  // из-за забытого поиска), поэтому его тоже нужно уметь снять отдельно.
  if (state.search) chips.push([`Поиск: «${state.search}»`, clearSearch]);
  const subs = (state.facets && state.facets.subcategories) || [];
  (f.subcat || []).forEach(sl => {
    const sc = subs.find(x => x.slug === sl);
    chips.push([sc ? sc.name : sl, () => toggleArrFilter('subcat', sl)]);
  });
  (f.brand || []).forEach(b => chips.push([`Бренд: ${b === '__none__' ? 'Другой' : b}`, () => toggleArrFilter('brand', b)]));
  (f.subtype || []).forEach(b => chips.push([`Тип: ${b}`, () => toggleArrFilter('subtype', b)]));
  if (f.priceMin || f.priceMax) chips.push([`Цена ${f.priceMin||'0'}–${f.priceMax||'∞'}`, () => { f.priceMin=f.priceMax=null; buildFilters(); reloadFiltered(); }]);
  if (f.perfMin || f.perfMax) chips.push([`Произв. ${f.perfMin||'0'}–${f.perfMax||'∞'}`, () => { f.perfMin=f.perfMax=null; buildFilters(); reloadFiltered(); }]);
  const el = document.getElementById('activeFilters');
  el.innerHTML = chips.map((c, i) => `<button class="chip" data-i="${i}">${c[0]} ✕</button>`).join('');
  el.querySelectorAll('.chip').forEach((b, i) => b.onclick = chips[i][1]);
}

function cardHtml(p) {
  const imgHtml = p.icon
    ? `<img src="/icons/${p.icon}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">`
    : `<span class="card-emoji">${getCatEmoji(p.category_slug)}</span>`;
  const priceHtml = p.price_on_request
    ? `<div class="card-price-request">Цена по запросу</div>`
    : p.price ? `<div class="card-price">${formatPrice(p.price)}</div>`
    : `<div class="card-price-request">Уточните цену</div>`;
  const addBtn = p.price_on_request
    ? `<button class="btn-offer" onclick="event.stopPropagation();requestModal(${p.id})"><img src="/assets/icons/icon-offer.png" alt=""> Запросить цену</button>`
    : `<button class="btn-buy" onclick="event.stopPropagation();addToCart(${p.id})"><img src="/assets/icons/icon-buy.png" alt=""> В корзину</button>`;
  const favOn = favIds.includes(p.id);
  const cmpOn = compareIds.includes(p.id);
  const favBtn = state.settings.favorites !== false
    ? `<button class="card-fav${favOn?' on':''}" title="В избранное" onclick="event.stopPropagation();toggleFav(${p.id})">${favOn?'♥':'♡'}</button>` : '';
  const cmpBtn = state.settings.compare !== false
    ? `<label class="card-compare" onclick="event.stopPropagation()"><input type="checkbox" ${cmpOn?'checked':''} onchange="toggleCompare(${p.id})"> Сравнить</label>` : '';

  return `<div class="product-card${p.featured?' featured':''}" onclick="openModal(${p.id})">
    <div class="card-img-wrap">
      ${p.featured ? '<span class="badge-hit">⭐ Хит продаж</span>' : ''}
      ${favBtn}
      ${imgHtml}
    </div>
    <div class="card-body">
      ${p.brand ? `<div class="card-brand">${p.brand}</div>` : ''}
      <a class="card-name" href="${productUrl(p)}" onclick="event.stopPropagation();openModal(${p.id});return false;">${p.name}</a>
      ${p.article ? `<div class="card-article">Арт: ${p.article}</div>` : ''}
    </div>
    <div class="card-footer-row">
      ${priceHtml}
      <a class="btn-detail" href="${productUrl(p)}" onclick="event.stopPropagation();openModal(${p.id});return false;">Подробнее <img src="/assets/icons/arrow-green.png" alt="→"></a>
    </div>
    <div class="card-actions-row">${addBtn}${cmpBtn}</div>
  </div>`;
}

function renderPagination(total) {
  const pages = Math.ceil(total / state.limit);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML=''; return; }
  let html = '';
  if (state.page > 1) html += `<button class="page-btn" onclick="goPage(${state.page-1})">← Назад</button>`;
  for (let i = Math.max(1, state.page-2); i <= Math.min(pages, state.page+2); i++) {
    html += `<button class="page-btn${i===state.page?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (state.page < pages) html += `<button class="page-btn" onclick="goPage(${state.page+1})">Вперёд →</button>`;
  el.innerHTML = html;
}

function goPage(p) { state.page = p; loadProducts(); window.scrollTo(0,300); }
function applySort(v) { state.sort = v; state.page = 1; loadProducts(); }

// ===== КАРТОЧКА ТОВАРА =====
// Вынесена в /js/product.js: showProduct, openModal, closeModal, miniCard,
// requestModal, renderPvFav, pvSetImg, pvNav, ytEmbed

// ===== CART =====
function addToCart(id) {
  const existing = state.cart.find(i => i.id === id);
  if (existing) { existing.qty++; saveCart(); renderCart(); showToast('✅ Количество обновлено', 'green'); return; }
  fetch(`/api/products/${id}`).then(r=>r.json()).then(p => {
    state.cart.push({ id:p.id, name:p.name, price:p.price, price_on_request:p.price_on_request, icon:p.icon, brand:p.brand, category_slug:p.category_slug, qty:1 });
    saveCart(); renderCart(); showToast('✅ Добавлено в корзину', 'green');
  });
}
function removeFromCart(id) { state.cart = state.cart.filter(i=>i.id!==id); saveCart(); renderCart(); }
function changeQty(id, d) { const i = state.cart.find(i=>i.id===id); if(i){ i.qty=Math.max(1,i.qty+d); saveCart(); renderCart(); } }
function saveCart() {
  try { localStorage.setItem('cart', JSON.stringify(state.cart)); } catch{}
  document.getElementById('cartCount').textContent = state.cart.reduce((s,i)=>s+i.qty,0);
}
function renderCart() {
  document.getElementById('cartCount').textContent = state.cart.reduce((s,i)=>s+i.qty,0);
  refreshCartBonus();
  const el = document.getElementById('cartItems');
  if (!state.cart.length) {
    el.innerHTML = `<div class="cart-empty"><span>🛒</span>Корзина пуста.<br>Добавьте товары из каталога.</div>`;
    document.getElementById('cartTotal').textContent = '0 ₸'; return;
  }
  el.innerHTML = state.cart.map(item=>`
    <div class="cart-item">
      <div class="cart-item-img">${item.icon?`<img src="/icons/${item.icon}" alt="">`:getCatEmoji(item.category_slug||'')}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price ${item.price_on_request?'request':''}">${item.price_on_request?'По запросу':formatPrice(item.price*item.qty)}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <button class="cart-remove" onclick="removeFromCart(${item.id})">🗑</button>
    </div>`).join('');
  const total = state.cart.filter(i=>!i.price_on_request).reduce((s,i)=>s+i.price*i.qty,0);
  const hasReq = state.cart.some(i=>i.price_on_request);
  const bonusUsed = cartBonusToUse(total);
  document.getElementById('cartTotal').textContent = formatPrice(total - bonusUsed)+(hasReq?' + по запросу':'')+(bonusUsed?` (списано ${formatPrice(bonusUsed)} бонусов)`:'');
}
// Сколько бонусов реально спишем: не больше остатка клиента и не больше суммы заказа.
function cartBonusToUse(total) {
  const cb = document.getElementById('cartUseBonus');
  const c = window.custState && window.custState.customer;
  if (!cb || !cb.checked || !c) return 0;
  return Math.max(0, Math.min(c.bonusBalance || 0, total));
}
window.refreshCartBonus = function () {
  const row = document.getElementById('cartBonusRow');
  if (!row) return;
  const c = window.custState && window.custState.customer;
  if (c && c.bonusBalance > 0) {
    row.style.display = '';
    document.getElementById('cartBonusAvail').textContent = c.bonusBalance;
  } else {
    row.style.display = 'none';
  }
};
function toggleCart() {
  const p = document.getElementById('cartPanel');
  const o = document.getElementById('cartOverlay');
  const open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  o.classList.toggle('open', open);
}
async function submitOrder() {
  const nameEl = document.getElementById('oName'), phoneEl = document.getElementById('oPhone');
  if (!nameEl.reportValidity() || !phoneEl.reportValidity()) return;
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  if (!window.isValidPhone(phone)) { showToast('⚠️ Введите корректный номер телефона'); return; }
  const btn = document.querySelector('.cart-footer .btn-primary');
  btn.disabled=true; btn.textContent='Отправляем…';
  try {
    const total = state.cart.filter(i=>!i.price_on_request).reduce((s,i)=>s+i.price*i.qty,0);
    const res = await apiFetch('/api/orders','POST',{
      name, phone,
      message: document.getElementById('oMessage').value.trim(),
      items: JSON.stringify(state.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price||0}))),
      useBonus: cartBonusToUse(total)
    });
    if (res.success) {
      showToast('✅ Заявка отправлена! ' + window.contactSoonText(),'green');
      state.cart=[]; saveCart();
      const cb = document.getElementById('cartUseBonus'); if (cb) cb.checked = false;
      renderCart();
      ['oName','oPhone','oMessage'].forEach(id=>document.getElementById(id).value='');
      toggleCart();
      if (window.custState && window.custState.token) {
        apiFetch('/api/me').then(r => { if (r.customer) { window.custState.customer = r.customer; refreshAccountUI(); } });
      }
    }
  } catch (e) { console.error('submitOrder:', e); window.logClientError(e && (e.message || e), 'submitOrder'); showToast('❌ Ошибка. Попробуйте ещё раз.'); }
  btn.disabled=false; btn.textContent='✅ Отправить заявку';
}

// ===== ИЗБРАННОЕ =====
function toggleFav(id) {
  const i = favIds.indexOf(id);
  const adding = i === -1;
  adding ? favIds.push(id) : favIds.splice(i, 1);
  lsSet('favorites', favIds);
  renderFavBadge();
  showToast(adding ? '♥ Добавлено в избранное' : 'Убрано из избранного', adding ? 'green' : '');
  // обновляем сердечки на месте, без перезагрузки списка
  document.querySelectorAll(`.card-fav`).forEach(btn => {
    const m = (btn.getAttribute('onclick') || '').match(/toggleFav\((\d+)\)/);
    if (m && +m[1] === id) { btn.classList.toggle('on', adding); btn.textContent = adding ? '♥' : '♡'; }
  });
  if (state.view === 'favorites') showFavorites();
}
function renderFavBadge() {
  document.querySelectorAll('.fav-count').forEach(el => {
    el.textContent = favIds.length;
    el.style.display = favIds.length ? '' : 'none';
  });
}

// ===== СРАВНЕНИЕ =====
function toggleCompare(id) {
  const i = compareIds.indexOf(id);
  if (i === -1) {
    if (compareIds.length >= 4) { showToast('Можно сравнить до 4 товаров'); return renderCatalogChecks(); }
    compareIds.push(id);
  } else compareIds.splice(i, 1);
  lsSet('compare', compareIds);
  renderCompareBar();
}
function renderCatalogChecks() {
  document.querySelectorAll('.card-compare input').forEach(cb => {
    const m = (cb.getAttribute('onchange') || '').match(/toggleCompare\((\d+)\)/);
    if (m) cb.checked = compareIds.includes(+m[1]);
  });
}
async function renderCompareBar() {
  const bar = document.getElementById('compareBar');
  document.getElementById('compareCount').textContent = compareIds.length;
  if (compareIds.length < 1) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const items = await Promise.all(compareIds.map(id => apiFetch('/api/products/' + id).catch(() => null)));
  document.getElementById('compareThumbs').innerHTML = items.filter(Boolean).map(p =>
    `<div class="cmp-thumb">${p.icon ? `<img src="/icons/${p.icon}" onerror="this.replaceWith('📦')">` : getCatEmoji(p.category_slug)}
      <button onclick="toggleCompare(${p.id})">✕</button></div>`).join('');
}
function clearCompare() { compareIds = []; lsSet('compare', compareIds); renderCompareBar(); renderCatalogChecks(); }
async function openCompare() {
  if (compareIds.length < 2) { showToast('Выберите минимум 2 товара'); return; }
  const items = (await Promise.all(compareIds.map(id => apiFetch('/api/products/' + id).catch(() => null)))).filter(Boolean);
  const specKeys = [...new Set(items.flatMap(p => {
    let s = p.specs; if (typeof s === 'string') { try { s = JSON.parse(s); } catch { s = {}; } }
    return Object.keys(s || {});
  }))];
  const specOf = (p, k) => { let s = p.specs; if (typeof s === 'string') { try { s = JSON.parse(s); } catch { s = {}; } } return (s || {})[k] || '—'; };
  const row = (label, cells) => `<tr><th>${label}</th>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
  document.getElementById('compareTable').innerHTML =
    row('', items.map(p => `<button class="modal-close" style="position:static" onclick="toggleCompare(${p.id});openCompare()">✕</button>`)) +
    row('Название', items.map(p => `<strong>${p.name}</strong>`)) +
    row('Бренд', items.map(p => p.brand || '—')) +
    row('Цена', items.map(p => p.price_on_request ? 'По запросу' : (p.price ? formatPrice(p.price) : '—'))) +
    row('Производительность', items.map(p => p.perf ? p.perf + ' ' + (p.perf_unit || '') : '—')) +
    specKeys.map(k => row(k, items.map(p => specOf(p, k)))).join('') +
    row('', items.map(p => p.price_on_request
      ? `<button class="btn-offer" onclick="requestModal(${p.id})">Запросить</button>`
      : `<button class="btn-buy" onclick="addToCart(${p.id})">В корзину</button>`));
  document.getElementById('compareModal').classList.add('open');
}
function closeCompare() { document.getElementById('compareModal').classList.remove('open'); }

// ===== НЕДАВНО ПРОСМОТРЕННЫЕ =====
function pushRecent(id) {
  recentIds = [id, ...recentIds.filter(x => x !== id)].slice(0, 10);
  lsSet('recent', recentIds);
  renderRecent();
}
async function renderRecent() {
  const sec = document.getElementById('recentSection');
  const ids = recentIds.slice(0, 8);
  if (state.settings.blocks.recent === false || ids.length < 2 || state.view === 'favorites') { sec.style.display = 'none'; return; }
  const items = (await Promise.all(ids.map(id => apiFetch('/api/products/' + id).catch(() => null)))).filter(Boolean);
  if (items.length < 2) { sec.style.display = 'none'; return; }
  document.getElementById('recentStrip').innerHTML = items.map(miniCard).join('');
  sec.style.display = '';
}

// ===== ОПИСАНИЕ РАЗДЕЛА (SEO-текст внизу каталога) =====
function renderCatalogAbout() {
  const sec = document.getElementById('catalogAbout');
  const cat = (state.categories || []).find(c => c.slug === state.category);
  // показываем только на странице категории/подкатегории (не поиск, не избранное, не «Все»)
  if (state.view !== 'catalog' || !cat || state.search) { sec.style.display = 'none'; return; }

  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nl2p = t => escH(t).trim().split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, '<br>')}</p>`).join('');

  const allSubs = (state.facets && state.facets.subcategories) || [];
  const bySlug = allSubs.reduce((o, s) => { o[s.slug] = s; return o; }, {});
  const curSub = (state.filters && state.filters.subcat) || [];
  const sel = curSub.length === 1 ? curSub[0] : null;
  const selRow = sel ? bySlug[sel] : null;

  // только поле «Описание» из админки; нет описания → блок не показываем
  const descText = selRow ? (selRow.description || '') : (cat.description || '');

  if (!descText || !String(descText).replace(/<[^>]*>/g, '').trim()) { sec.style.display = 'none'; return; }
  // если в описании есть html-теги (задано редактором в админке) — вставляем как есть,
  // иначе — простой текст разбиваем на абзацы по пустой строке
  const bodyHtml = /<[a-z][\s\S]*>/i.test(descText) ? descText : nl2p(descText);
  document.getElementById('catalogAboutBody').innerHTML =
    `<div class="catalog-about-text">${bodyHtml}</div>`;
  sec.style.display = '';
}

// ===== КВИЗ ПОДБОРА =====
let quizAns = {};
function initQuizCta() {
  const q = state.settings.quiz || {};
  const cta = document.getElementById('quizCta');
  if (!cta) return;   // homeView ещё не подгружен (первый заход не на главную)
  if (q.enabled === false || !q.steps || !q.steps.length) { cta.style.display = 'none'; return; }
  document.getElementById('quizCtaTitle').textContent = q.title || 'Подбор оборудования';
  document.getElementById('quizCtaSub').textContent = q.subtitle || '';
  cta.style.display = '';
}
function openQuiz() {
  const q = state.settings.quiz || {};
  if (!q.steps || !q.steps.length) { showToast('Подбор временно недоступен'); return; }
  quizAns = {};
  renderQuizStep(0);
  document.getElementById('quizModal').classList.add('open');
}
function closeQuiz() { document.getElementById('quizModal').classList.remove('open'); }
function renderQuizStep(i) {
  const q = state.settings.quiz;
  const step = q.steps[i];
  const total = q.steps.length;
  document.getElementById('quizBody').innerHTML = `
    <div class="quiz-progress">${q.steps.map((s, n) => `<span class="${n <= i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="quiz-step-label">Шаг ${i + 1} из ${total}</div>
    <h3 class="modal-name">${step.label}</h3>
    <div class="quiz-options">
      ${step.options.map(o => `<button class="quiz-opt" onclick="quizPick('${step.key}','${o.id}',${i})">${o.label}</button>`).join('')}
    </div>
    ${i > 0 ? `<button class="quiz-back" onclick="renderQuizStep(${i - 1})">← Назад</button>` : ''}`;
}
function quizPick(key, id, i) {
  quizAns[key] = id;
  const q = state.settings.quiz;
  if (i + 1 < q.steps.length) renderQuizStep(i + 1);
  else quizSubmit();
}
async function quizSubmit() {
  document.getElementById('quizBody').innerHTML = '<div class="spinner"><div class="spin"></div>&nbsp; Подбираем…</div>';
  const res = await apiFetch('/api/products/quiz', 'POST', quizAns);
  const list = res.products || [];
  document.getElementById('quizBody').innerHTML = `
    <h3 class="modal-name">${list.length ? 'Рекомендуем для вас' : 'Не нашли точного совпадения'}</h3>
    <p class="quiz-step-label">${list.length ? 'Подобрано по вашим ответам. Уточните детали у менеджера.' : 'Оставьте заявку — подберём вручную.'}</p>
    <div class="mini-row">${list.map(miniCard).join('')}</div>
    <div class="quiz-result-actions">
      <button class="btn-catalog" onclick="closeQuiz();scrollToConsult()">Получить консультацию</button>
      <button class="quiz-back" onclick="quizAns={};renderQuizStep(0)">Пройти заново</button>
    </div>`;
}

// ===== UTILS =====
// toggleDrawer/closeDrawer, toggleSearch, scrollToConsult, submitConsult,
// showToast, apiFetch, formatPrice — в /js/site.js (общие для всех страниц)
function getCatEmoji(slug) {
  return {avtomoyki:'🚗',sto:'🔧',klining:'🧹',voda:'💧',aksessuary:'⚙️',promyshlennoe:'🏭'}[slug]||'📦';
}
function catIconUrl(icon) {
  if (!icon) return '/assets/icons/cat-wash.png';
  return /^https?:|^\//.test(icon) ? icon : '/icons/' + icon;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeCompare(); closeQuiz(); }
});

init();
</script>
