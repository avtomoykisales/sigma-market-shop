<!-- HERO -->
<section class="hero-section" id="heroSlider">
  <div class="hero-text">
    <p class="hero-title">Профессиональное<br>оборудование<br>для бизнеса</p>
    <p class="hero-sub">Комплексное решение для автосалонов, СТО,<br>клининга и промышленности по всему Казахстану</p>
    <div class="hero-buttons">
      <a class="btn-catalog" href="/catalog" onclick="return heroGo('all','')">Смотреть каталог</a>
    </div>
  </div>

  <div class="hero-image">
    <a class="hero-slide-img is-active" href="/catalog/klining/polomoechnye-mashiny"
       onclick="return heroGo('klining','polomoechnye-mashiny')">
      <img src="/assets/icons/hero-polo.jpg" alt="Поломоечные машины"
           onerror="this.onerror=null;this.src='/assets/icons/banner.png'">
      <span class="hero-slide-cap">Поломоечные машины</span>
    </a>
    <a class="hero-slide-img" href="/catalog/klining/podmetalnye-mashiny"
       onclick="return heroGo('klining','podmetalnye-mashiny')">
      <img src="/assets/icons/hero-podmet.jpg" alt="Подметальные машины"
           onerror="this.onerror=null;this.src='/assets/icons/banner.png'">
      <span class="hero-slide-cap">Подметальные машины</span>
    </a>
    <a class="hero-slide-img" href="/catalog/avtomojka"
       onclick="return heroGo('avtomojka','')">
      <img src="/assets/icons/hero-avto.jpg" alt="Оборудование для автомойки"
           onerror="this.onerror=null;this.src='/assets/icons/banner.png'">
      <span class="hero-slide-cap">Оборудование для автомойки</span>
    </a>
    <a class="hero-slide-img" href="/catalog/sto"
       onclick="return heroGo('sto','')">
      <img src="/assets/icons/hero-sto.jpg" alt="Оборудование для СТО и автосервиса"
           onerror="this.onerror=null;this.src='/assets/icons/banner.png'">
      <span class="hero-slide-cap">Оборудование для СТО и автосервиса</span>
    </a>
    <a class="hero-slide-img" href="/catalog/avtomojka/avtomaticheskie-moyki-dlya-mashin-robotizirovann"
       onclick="return heroGo('avtomojka','avtomaticheskie-moyki-dlya-mashin-robotizirovann')">
      <img src="/assets/icons/hero-avtomatic.jpg" alt="Автоматические автомойки"
           onerror="this.onerror=null;this.src='/assets/icons/banner.png'">
      <span class="hero-slide-cap">Автоматические автомойки</span>
    </a>

    <button class="carousel-btn prev" type="button" aria-label="Назад" onclick="heroStep(-1)"><img src="/assets/icons/arrow-left.png" alt="←"></button>
    <button class="carousel-btn next" type="button" aria-label="Вперёд" onclick="heroStep(1)"><img src="/assets/icons/arrow-right.png" alt="→"></button>
    <div class="hero-dots" id="heroDots"></div>
  </div>
</section>
