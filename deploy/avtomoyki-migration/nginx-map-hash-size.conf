# /etc/nginx/conf.d/00-map-hash-size.conf
#
# Нужен для карты редиректов avtomoyki-map.conf — в ней длинные ключи/значения
# (слаги товаров до ~80 символов), стандартного map_hash_bucket_size не хватает:
#   nginx: [emerg] could not build map_hash, you should increase map_hash_bucket_size: 64
#
# Должен грузиться в http{} контексте (conf.d грузится именно туда) — порядок
# относительно avtomoyki-map.conf не важен, nginx считывает все директивы до
# инициализации карты.

map_hash_bucket_size 256;
