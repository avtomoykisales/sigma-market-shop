# /etc/nginx/sites-available/avtomoyki   (+ symlink в /etc/nginx/sites-enabled/)
#
# 301-редиректы avtomoyki.kz -> b2btech.kz.
# map $b2b_redirect подключается из /etc/nginx/conf.d/avtomoyki-map.conf
#
# Порядок:
#   1) положить оба файла, включить symlink, `sudo nginx -t && sudo systemctl reload nginx`
#   2) sudo certbot --nginx -d avtomoyki.kz -d www.avtomoyki.kz
#      (certbot сам добавит сюда listen 443 + ssl_certificate + редирект 80->443)

server {
    listen 80;
    listen [::]:80;
    server_name avtomoyki.kz www.avtomoyki.kz;

    # для выпуска сертификата Let's Encrypt
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # постраничные 301 из карты
    if ($b2b_redirect) { return 301 https://b2btech.kz$b2b_redirect; }

    # всё остальное (неизвестные старые адреса) -> главная нового сайта
    location / { return 301 https://b2btech.kz/; }
}
