# /etc/nginx/sites-available/sigma-shop
# Реверс-прокси на Node-магазин (pm2, порт 3001).
# Домен: b2btech.kz (канонический, без www).
# SSL:  sudo certbot --nginx -d b2btech.kz -d www.b2btech.kz
#       (certbot добавит listen 443 в оба server-блока ниже и редирект 80→443)

# --- www.b2btech.kz → b2btech.kz (301) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.b2btech.kz;
    return 301 https://b2btech.kz$request_uri;
}

# --- основной сайт ---
server {
    listen 80;
    listen [::]:80;
    server_name b2btech.kz;

    # админка грузит фото товаров (multer до 20 МБ) — иначе nginx режет на 1 МБ
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
