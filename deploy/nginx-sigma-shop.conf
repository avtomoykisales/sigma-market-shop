# /etc/nginx/sites-available/sigma-shop
# Реверс-прокси на Node-магазин (pm2, порт 3001).
# После привязки домена: заменить server_name и прогнать:
#     certbot --nginx -d shop.example.kz

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                 # позже поставить домен, напр. shop.example.kz

    # админка грузит фото товаров (multer до 20 МБ) — иначе nginx режет на 1 МБ
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
